[build]
  publish = "dist"
  command = "pnpm install --frozen-lockfile --ignore-scripts && pnpm run copy:vditor && vite build"

[build.environment]
  NODE_VERSION = "20"

# HotNews API 代理：规避浏览器 CORS 限制（同源转发到真实 API）
[[redirects]]
  from = "/api/news/*"
  to = "https://60s.fqy-jfb.workers.dev/v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/news-fallback/*"
  to = "https://60s.viki.moe/v2/:splat"
  status = 200
  force = true

# IP 定位代理：ip-api 免费版仅支持 HTTP，web 端 HTTPS 页面通过同源代理转发规避 Mixed Content
[[redirects]]
  from = "/api/ip/*"
  to = "http://demo.ip-api.com/:splat"
  status = 200
  force = true
