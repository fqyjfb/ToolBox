<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolBox - 锁定</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="lock-container">
    <div class="title-bar" id="titleBar">
      <span class="title-text">
        <img src="./favicon.png" alt="ToolBox" class="title-icon" />
        ToolBox - 解锁
      </span>
      <div class="title-actions">
        <button class="exit-btn" id="exitBtn" title="退出">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
        <button class="close-btn" id="closeBtn" title="关闭">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="lock-content">
      <div class="lock-icon-wrapper">
        <div class="loader">
          <div class="dot white"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
      <form id="unlockForm" class="lock-form">
        <div class="password-input-wrapper">
          <svg class="password-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            type="password"
            id="passwordInput"
            class="password-input"
            placeholder="请输入密码"
            autocomplete="off"
            autofocus
          >
          <button type="submit" class="unlock-btn" title="解锁">
            <svg class="unlock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p id="errorMsg" class="error-msg hidden">密码错误，请重试</p>
      </form>
    </div>
  </div>
  <script src="lock.cjs"></script>
</body>
</html>
