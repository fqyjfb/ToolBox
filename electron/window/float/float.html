<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolBox Float</title>
  <link rel="stylesheet" href="float.css">
  <link rel="stylesheet" href="float-pet.css">
</head>
<body>
  <div class="float-ball" id="floatBall" data-mood="idle">
    <!-- 桌宠形象：结构见 float-pet.css，换装片段来自 pet-catalog.cjs，绘制令牌见 float-pet.css -->
    <div class="float-pet" id="floatPet" data-outfit="tape">
      <svg id="petSvg" viewBox="0 0 66 90" aria-hidden="true">
        <defs>
          <path id="petBodyShape" d="M33,21 C45,21 54.6,29.4 57.2,40 C59,47.6 58.2,56.4 53.2,62.8 C48.6,68.6 40.8,71 33,71 C25.2,71 17.4,68.6 12.8,62.8 C7.8,56.4 7,47.6 8.8,40 C11.4,29.4 21,21 33,21Z"/>
          <clipPath id="petBodyClip"><use href="#petBodyShape"/></clipPath>
        </defs>

        <!-- 地面投影：唯一悬浮提示，不参与呼吸缩放 -->
        <ellipse class="pet-shadow" cx="33" cy="82" rx="15" ry="2.6"/>

        <g class="pet-body-scale">
          <!-- 尾部槽位（z=1）：与身体同组呼吸；绘于主体之下，尾巴从轮廓后方长出 -->
          <g id="slot-tail" data-slot="tail"></g>

          <!-- 主体：三段平涂（亮面只压头顶，暗面只压下沿，不跨越五官） -->
          <use class="pet-fill-base" href="#petBodyShape"/>
          <g clip-path="url(#petBodyClip)">
            <ellipse class="pet-fill-light" cx="27" cy="23.5" rx="17" ry="10" transform="rotate(-8 27 23.5)"/>
            <ellipse class="pet-fill-shade" cx="33" cy="80" rx="27" ry="15"/>
          </g>
          <use class="pet-rim" href="#petBodyShape"/>

          <!-- 躯干槽位（z=2） -->
          <g id="slot-body" data-slot="body"></g>

          <!-- 双脚：露出球体下沿 -->
          <g class="pet-leg pet-leg-l">
            <ellipse class="pet-fill-shade" cx="23" cy="71" rx="6.6" ry="4"/>
            <ellipse class="pet-fill-cream" cx="23" cy="69.6" rx="2.2" ry="1.1" opacity=".3"/>
          </g>
          <g class="pet-leg pet-leg-r">
            <ellipse class="pet-fill-shade" cx="43" cy="71" rx="6.6" ry="4"/>
            <ellipse class="pet-fill-cream" cx="43" cy="69.6" rx="2.2" ry="1.1" opacity=".3"/>
          </g>

          <!-- 双手：拖拽时上举 -->
          <g class="pet-arm pet-arm-l">
            <rect class="pet-fill-base" x="4.6" y="50" width="8.6" height="11" rx="4.3"/>
            <circle class="pet-fill-cream" cx="7.4" cy="53.4" r="1.1" opacity=".45"/>
          </g>
          <g class="pet-arm pet-arm-r">
            <rect class="pet-fill-base" x="52.8" y="50" width="8.6" height="11" rx="4.3"/>
            <circle class="pet-fill-cream" cx="58.6" cy="53.4" r="1.1" opacity=".45"/>
          </g>

          <!-- 腮红 -->
          <ellipse class="pet-cheek" cx="17.5" cy="50.5" rx="5" ry="3.2"/>
          <ellipse class="pet-cheek" cx="48.5" cy="50.5" rx="5" ry="3.2"/>

          <!-- 眼睛：眨眼用 fill-box 缩放，不依赖身体配色 -->
          <g id="eyes">
            <g class="pet-eye">
              <circle class="pet-fill-ink" cx="25" cy="42" r="5.4"/>
              <g class="pupil">
                <circle class="pet-fill-cream" cx="25" cy="42" r="2.4"/>
                <circle class="pet-fill-cream" cx="26.2" cy="40.4" r=".95"/>
              </g>
            </g>
            <g class="pet-eye">
              <circle class="pet-fill-ink" cx="41" cy="42" r="5.4"/>
              <g class="pupil">
                <circle class="pet-fill-cream" cx="41" cy="42" r="2.4"/>
                <circle class="pet-fill-cream" cx="42.2" cy="40.4" r=".95"/>
              </g>
            </g>
          </g>

          <!-- 嘴 -->
          <g class="mouth-group">
            <path class="mouth-happy pet-stroke-ink" d="M29,51 Q33,55 37,51" fill="none" stroke-width="1.8" stroke-linecap="round"/>
            <path class="mouth-sad pet-stroke-ink" d="M29,54 Q33,50.5 37,54" fill="none" stroke-width="1.8" stroke-linecap="round"/>
            <ellipse class="mouth-ooo pet-fill-ink" cx="33" cy="52.4" rx="2" ry="2.5"/>
          </g>

          <!-- 颈部槽位（z=3） -->
          <g id="slot-neck" data-slot="neck"></g>

          <!-- 头部槽位（z=4） -->
          <g id="slot-head" data-slot="head"></g>
        </g>
      </svg>
    </div>
    <div class="pet-bubble" id="petBubble">
      <span class="pet-bubble-text" id="petBubbleText"></span>
      <div class="pet-bubble-actions" id="petBubbleActions" hidden></div>
    </div>
    <div class="pet-thinking-dots" id="petThinkingDots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div id="tooltipContainer"></div>
  </div>
  <script src="pet-catalog.cjs"></script>
  <script src="float-pet.cjs"></script>
  <script src="float.cjs"></script>
</body>
</html>
